name: Sync with Upstream

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/LineageOS/android.git"
          source_branch: "lineage-24.0"
          destination_branch: "lineage-24.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}
